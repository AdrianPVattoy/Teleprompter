<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Teleprompter</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Teleprompter" />
  <meta name="theme-color" content="#000000" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f2f2f7; color: #111; -webkit-tap-highlight-color: transparent;
    }
    body { overscroll-behavior: none; }
    #setup {
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)) 20px;
      max-width: 900px; margin: 0 auto; height: 100%; overflow: auto;
    }
    h2 { font-size: 28px; font-weight: 700; margin-bottom: 10px; color: #111; }
    .sub { font-size: 14px; color: #666; margin-bottom: 18px; }
    label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; }
    textarea {
      width: 100%; height: 220px; font-size: 18px; padding: 14px; border: 1px solid #ccc;
      border-radius: 16px; font-family: inherit; resize: vertical; background: #fff; color: #111; margin-bottom: 18px;
    }
    .row { display: flex; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
    .field { flex: 1; min-width: 220px; background: #fff; border-radius: 16px; padding: 14px; border: 1px solid #ddd; }
    .field span { font-size: 16px; font-weight: 700; color: #111; }
    .field input[type=range] { width: 100%; margin-top: 10px; height: 36px; }
    select, input[type=file] {
      width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; border: 1px solid #ccc;
      font-size: 16px; background: #fff; color: #111;
    }
    .toggle { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 15px; color: #111; }
    .toggle input { transform: scale(1.2); }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    #startBtn, #cleanBtn {
      flex: 1; min-width: 180px; padding: 16px; font-size: 18px; font-weight: 700; border: none; border-radius: 16px; cursor: pointer;
    }
    #startBtn { background: #111; color: #fff; }
    #cleanBtn { background: #e9e9ee; color: #111; }
    #prompter { display: none; position: fixed; inset: 0; background: #000; overflow: hidden; touch-action: none; }
    #text {
      color: #fff; line-height: 1.7;
      padding: 60vh 32px calc(60vh + env(safe-area-inset-bottom)) 32px;
      white-space: pre-wrap; word-break: break-word;
      transform: scaleX(-1) translateY(0); will-change: transform;
      user-select: none; -webkit-user-select: none;
    }
    #controls {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%); display: flex; gap: 12px; z-index: 20; flex-wrap: wrap; justify-content: center;
    }
    #controls button {
      padding: 14px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);
      font-size: 17px; font-weight: 600; cursor: pointer; background: rgba(255,255,255,0.16);
      color: #fff; backdrop-filter: blur(10px); min-width: 120px;
    }
    #hint {
      position: fixed; top: calc(16px + env(safe-area-inset-top)); right: 16px; font-size: 13px;
      color: rgba(255,255,255,0.4); z-index: 20; text-align: right;
    }
    #topFade, #bottomFade {
      position: fixed; left: 0; width: 100%; height: 18vh; z-index: 10; pointer-events: none;
    }
    #topFade { top: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.92), rgba(0,0,0,0)); }
    #bottomFade { bottom: 0; background: linear-gradient(to top, rgba(0,0,0,0.92), rgba(0,0,0,0)); }
    #status { margin-top: 12px; font-size: 14px; color: #666; min-height: 18px; }
  </style>
</head>
<body>
  <div id="setup">
    <h2>Teleprompter</h2>
    <div class="sub">for Offshoreutdanning.no</div>

    <label for="inputText">Lim inn teksten din</label>
    <textarea id="inputText" placeholder="Skriv eller lim inn teksten her..."></textarea>

    <div class="row">
      <div class="field">
        <label for="scriptFile">Last inn manusfil (.txt eller .md)</label>
        <input type="file" id="scriptFile" accept=".txt,.md,.markdown,text/plain,text/markdown" />
        <div id="status"></div>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="fontSize">Skriftstørrelse: <span id="sizeVal">52</span> px</label>
        <input type="range" min="24" max="120" value="52" id="fontSize" step="2" />
      </div>
      <div class="field">
        <label for="speed">Hastighet: <span id="speedVal">2.5</span></label>
        <input type="range" min="1" max="10" value="2.5" id="speed" step="0.25" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label for="fontSelect">Font</label>
        <select id="fontSelect">
          <option value="-apple-system,BlinkMacSystemFont,sans-serif">System</option>
          <option value="Helvetica,Arial,sans-serif">Helvetica</option>
          <option value="Verdana,Geneva,sans-serif">Verdana</option>
          <option value="Georgia,serif">Georgia</option>
          <option value="'Courier New',Courier,monospace">Courier</option>
          <option value="'Trebuchet MS',sans-serif">Trebuchet</option>
        </select>
      </div>
      <div class="field">
        <label>Tekstopprydding</label>
        <label class="toggle">
          <input type="checkbox" id="normalizeSpacing" checked />
          Teleprompter-modus (mindre mellomrom)
        </label>
        <label class="toggle">
          <input type="checkbox" id="stripMarkdown" checked />
          Fjern enkel markdown-formattering
        </label>
        <label class="toggle">
          <input type="checkbox" id="mirrorToggle" checked />
          Speil tekst
        </label>
      </div>
    </div>

    <div class="actions">
      <button id="cleanBtn">Rydd tekst</button>
      <button id="startBtn">Start teleprompter</button>
    </div>
  </div>

  <div id="prompter">
    <div id="topFade"></div>
    <div id="bottomFade"></div>
    <div id="text"></div>
    <div id="controls">
      <button id="toggleBtn">⏸ Pause</button>
      <button id="mirrorBtn">🪞 Speil av</button>
      <button id="restartBtn">↺ Start på nytt</button>
      <button id="stopBtn">✕ Avslutt</button>
    </div>
    <div id="hint">Trykk for pause/play • dra teksten for manuell scroll</div>
  </div>

  <script>
    const inputText = document.getElementById('inputText');
    const fontSizeInput = document.getElementById('fontSize');
    const speedInput = document.getElementById('speed');
    const fontSelect = document.getElementById('fontSelect');
    const sizeVal = document.getElementById('sizeVal');
    const speedVal = document.getElementById('speedVal');
    const textEl = document.getElementById('text');
    const setupEl = document.getElementById('setup');
    const prompterEl = document.getElementById('prompter');
    const toggleBtn = document.getElementById('toggleBtn');
    const mirrorBtn = document.getElementById('mirrorBtn');
    const scriptFile = document.getElementById('scriptFile');
    const statusEl = document.getElementById('status');
    const normalizeSpacing = document.getElementById('normalizeSpacing');
    const stripMarkdown = document.getElementById('stripMarkdown');
    const mirrorToggle = document.getElementById('mirrorToggle');

    let animId = null;
    let running = false;
    let pos = 0;
    let lastTs = null;
    let isDragging = false;
    let dragMoved = false;
    let startY = 0;
    let mirrored = true;

    inputText.value = localStorage.getItem('tp_text') || '';
    fontSizeInput.value = localStorage.getItem('tp_size') || '52';
    speedInput.value = localStorage.getItem('tp_speed') || '2.5';
    fontSelect.value = localStorage.getItem('tp_font') || '-apple-system,BlinkMacSystemFont,sans-serif';
    normalizeSpacing.checked = (localStorage.getItem('tp_normalize_spacing') ?? 'true') === 'true';
    stripMarkdown.checked = (localStorage.getItem('tp_strip_markdown') ?? 'true') === 'true';
    mirrored = (localStorage.getItem('tp_mirrored') ?? 'true') === 'true';
    mirrorToggle.checked = mirrored;

    sizeVal.textContent = fontSizeInput.value;
    speedVal.textContent = formatSpeed(speedInput.value);

    function formatSpeed(value) {
      return Number(value).toFixed(2).replace(/\.00$/, '').replace(/0$/, '');
    }

    function saveSettings() {
      localStorage.setItem('tp_text', inputText.value);
      localStorage.setItem('tp_size', fontSizeInput.value);
      localStorage.setItem('tp_speed', speedInput.value);
      localStorage.setItem('tp_font', fontSelect.value);
      localStorage.setItem('tp_normalize_spacing', normalizeSpacing.checked);
      localStorage.setItem('tp_strip_markdown', stripMarkdown.checked);
      localStorage.setItem('tp_mirrored', mirrored);
    }

    function updateMirrorUi() {
      mirrorToggle.checked = mirrored;
      mirrorBtn.textContent = mirrored ? '🪞 Speil av' : '🪞 Speil på';
      renderText();
    }

    function applyTextStyle() {
      textEl.style.fontSize = fontSizeInput.value + 'px';
      textEl.style.fontFamily = fontSelect.value;
    }

    function cleanScript(text) {
      let cleaned = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      if (stripMarkdown.checked) {
        cleaned = cleaned
          .replace(/^#{1,6}\s+/gm, '')
          .replace(/\*\*(.*?)\*\*/g, '$1')
          .replace(/__(.*?)__/g, '$1')
          .replace(/\*(.*?)\*/g, '$1')
          .replace(/_(.*?)_/g, '$1')
          .replace(/^\s*[-*+]\s+/gm, '')
          .replace(/^\s*\d+\.\s+/gm, '')
          .replace(/`{1,3}/g, '')
          .replace(/\[(.*?)\]\((.*?)\)/g, '$1');
      }

      cleaned = cleaned
        .replace(/[ \t]+\n/g, '\n')
        .replace(/[ \t]{2,}/g, ' ');

      if (normalizeSpacing.checked) {
        cleaned = cleaned
          .replace(/\n{2,}/g, '\n');
      } else {
        cleaned = cleaned
          .replace(/\n{3,}/g, '\n\n');
      }

      return cleaned.trim();
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    inputText.addEventListener('input', saveSettings);

    fontSizeInput.addEventListener('input', () => {
      sizeVal.textContent = fontSizeInput.value;
      saveSettings();
      applyTextStyle();
    });

    speedInput.addEventListener('input', () => {
      speedVal.textContent = formatSpeed(speedInput.value);
      saveSettings();
    });

    fontSelect.addEventListener('change', () => {
      saveSettings();
      applyTextStyle();
    });

    normalizeSpacing.addEventListener('change', saveSettings);
    stripMarkdown.addEventListener('change', saveSettings);

    mirrorToggle.addEventListener('change', () => {
      mirrored = mirrorToggle.checked;
      saveSettings();
      updateMirrorUi();
    });

    mirrorBtn.addEventListener('click', () => {
      mirrored = !mirrored;
      saveSettings();
      updateMirrorUi();
    });

    scriptFile.addEventListener('change', async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        const text = await file.text();
        inputText.value = cleanScript(text);
        saveSettings();
        setStatus('Manus lastet inn: ' + file.name);
      } catch (err) {
        setStatus('Kunne ikke lese filen.');
      }
    });

    document.getElementById('cleanBtn').addEventListener('click', () => {
      inputText.value = cleanScript(inputText.value);
      saveSettings();
      setStatus('Teksten er ryddet.');
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      const raw = inputText.value.trim();
      if (!raw) return;

      const txt = cleanScript(raw);
      inputText.value = txt;
      saveSettings();

      textEl.textContent = txt;
      applyTextStyle();

      pos = 0;
      lastTs = null;
      running = true;
      toggleBtn.textContent = '⏸ Pause';

      prompterEl.style.display = 'block';
      setupEl.style.display = 'none';

      startScroll();
    });

    function renderText() {
      const mirrorPart = mirrored ? 'scaleX(-1) ' : '';
      textEl.style.transform = `${mirrorPart}translateY(-${pos}px)`;
    }

    function frame(ts) {
      if (lastTs === null) lastTs = ts;
      const dt = (ts - lastTs) / 16.67;
      lastTs = ts;

      if (running && !isDragging) {
        pos += parseFloat(speedInput.value) * 0.45 * dt;
        renderText();
      }

      animId = requestAnimationFrame(frame);
    }

    function startScroll() {
      cancelAnimationFrame(animId);
      renderText();
      animId = requestAnimationFrame(frame);
    }

    function togglePause() {
      running = !running;
      toggleBtn.textContent = running ? '⏸ Pause' : '▶ Spill';
      lastTs = null;
    }

    function stopPrompter() {
      cancelAnimationFrame(animId);
      prompterEl.style.display = 'none';
      setupEl.style.display = 'block';
      pos = 0;
      running = false;
      lastTs = null;
    }

    function restartPrompter() {
      pos = 0;
      running = true;
      lastTs = null;
      toggleBtn.textContent = '⏸ Pause';
      renderText();
    }

    function beginDrag(clientY) {
      isDragging = true;
      dragMoved = false;
      startY = clientY;
      running = false;
      toggleBtn.textContent = '▶ Spill';
      lastTs = null;
    }

    function moveDrag(clientY) {
      if (!isDragging) return;
      const delta = startY - clientY;
      if (Math.abs(delta) > 1) dragMoved = true;
      pos += delta;
      if (pos < 0) pos = 0;
      startY = clientY;
      renderText();
    }

    function endDrag() {
      isDragging = false;
    }

    textEl.addEventListener('touchstart', (e) => {
      beginDrag(e.touches[0].clientY);
    }, { passive: true });

    textEl.addEventListener('touchmove', (e) => {
      moveDrag(e.touches[0].clientY);
      e.preventDefault();
    }, { passive: false });

    textEl.addEventListener('touchend', endDrag);

    textEl.addEventListener('mousedown', (e) => {
      beginDrag(e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      moveDrag(e.clientY);
    });

    window.addEventListener('mouseup', endDrag);

    prompterEl.addEventListener('click', (e) => {
      if (e.target.closest('#controls')) return;
      if (dragMoved) {
        dragMoved = false;
        return;
      }
      togglePause();
    });

    toggleBtn.addEventListener('click', togglePause);
    document.getElementById('stopBtn').addEventListener('click', stopPrompter);
    document.getElementById('restartBtn').addEventListener('click', restartPrompter);

    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }
      lastTouchEnd = now;
    }, { passive: false });

    applyTextStyle();
    updateMirrorUi();
  </script>
</body>
</html>
