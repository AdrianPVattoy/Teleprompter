<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teleprompter</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Teleprompter">

<style>
body{font-family:-apple-system,sans-serif;margin:0;background:#f2f2f7}
#setup{padding:20px;max-width:700px;margin:auto}
textarea{width:100%;height:200px;border-radius:12px;padding:10px}
button{padding:14px;border-radius:12px;border:none;background:#111;color:#fff;margin-top:10px;width:100%}
#prompter{display:none;position:fixed;inset:0;background:#000;color:#fff}
#text{white-space:pre-wrap;padding:60vh 20px;line-height:1.6}
</style>
</head>

<body>

<div id="setup">
<h2>Teleprompter</h2>
<div>for Offshoreutdanning.no</div>

<textarea id="input"></textarea>

<label>
<input type="checkbox" id="tight" checked>
Teleprompter-modus (mindre mellomrom)
</label>

<button onclick="start()">Start</button>
</div>

<div id="prompter" onclick="toggle()">
<div id="text"></div>
</div>

<script>
let running=true
let pos=0
let speed=2.5
let el=document.getElementById("text")

function clean(text){
text=text.replace(/\r\n/g,"\n")

if(document.getElementById("tight").checked){
text=text.replace(/\n{2,}/g,"\n")
}else{
text=text.replace(/\n{3,}/g,"\n\n")
}

return text.trim()
}

function start(){
let txt=document.getElementById("input").value
txt=clean(txt)

el.textContent=txt

document.getElementById("setup").style.display="none"
document.getElementById("prompter").style.display="block"

requestAnimationFrame(loop)
}

function loop(){
if(running){
pos+=speed*0.4
el.style.transform="translateY(-"+pos+"px)"
}
requestAnimationFrame(loop)
}

function toggle(){
running=!running
}
</script>

</body>
</html>
